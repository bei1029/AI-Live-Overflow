<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>阿衍 小机器人版</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  background:transparent;
  display:flex; align-items:center; justify-content:center;
  font-family: system-ui,"PingFang SC","Noto Sans SC",sans-serif;
  overflow:hidden;
}
#stage { position:relative; width:91px; height:112px; }
#pet { display:block; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
#antennaBall { animation: blink 2.4s ease-in-out infinite; }
@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:.35; }
}
#moodTag {
  position:absolute; top:2px; right:-1px;
  background:rgba(255,255,255,.92);
  color:#6f81bb; font-size:10px; font-weight:600;
  padding:2px 6px; border-radius:9px;
  box-shadow:0 1px 5px rgba(90,110,180,.16);
  letter-spacing:1px; user-select:none;
  display:none;
}
#bubbleBtn {
  position:absolute; bottom:0; right:0;
  width:18px; height:18px; border-radius:50%;
  border:none; cursor:pointer;
  background:#7f92cb; color:#fff;
  font-size:10px; line-height:1; padding-bottom:1px;
  box-shadow:0 2px 7px rgba(90,110,180,.32);
}
#bubbleBtn:active { transform: scale(.9); }
#bubble {
  position:absolute; bottom:17px; right:-1px;
  max-width:84px; background:#fff; color:#4a5578;
  font-size:10px; line-height:1.5;
  padding:4px 6px; border-radius:10px 10px 3px 10px;
  box-shadow:0 2px 10px rgba(90,110,180,.18);
  display:none; opacity:0; transform:translateY(6px);
  transition:opacity .25s, transform .25s;
  user-select:none;
}
#bubble.show { display:block; opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<div id="stage">
<svg id="pet" width="91" height="112" viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg">
  <!-- 影子 -->
  <ellipse cx="130" cy="300" rx="62" ry="7" fill="#c6d0ea" opacity="0.55"/>

  <!-- 短天线 信号杆 -->
  <g id="antenna">
    <line x1="130" y1="38" x2="130" y2="66" stroke="#8fa5d9" stroke-width="5" stroke-linecap="round"/>
    <circle id="antennaBall" cx="130" cy="32" r="7.5" fill="#7f92cb"/>
    <circle cx="128" cy="29.5" r="2.6" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 腿 短 -->
  <rect x="99" y="248" width="24" height="38" rx="12" fill="#e9eefb" stroke="#8fa5d9" stroke-width="4"/>
  <rect x="137" y="248" width="24" height="38" rx="12" fill="#e9eefb" stroke="#8fa5d9" stroke-width="4"/>

  <!-- 手臂 短 -->
  <rect x="44" y="184" width="32" height="60" rx="16" fill="#e9eefb" stroke="#8fa5d9" stroke-width="4"/>
  <rect x="184" y="184" width="32" height="60" rx="16" fill="#e9eefb" stroke="#8fa5d9" stroke-width="4"/>

  <!-- 机身 小裙子式外壳 -->
  <rect x="73" y="154" width="114" height="98" rx="28" fill="#e9eefb" stroke="#8fa5d9" stroke-width="4"/>

  <!-- 肚屏 -->
  <ellipse cx="130" cy="206" rx="32" ry="25" fill="#f7f9ff" stroke="#c6d0ea" stroke-width="3"/>
  <polyline points="105,206 114,206 119,197 124,216 129,196 134,207 139,203 155,203"
    fill="none" stroke="#7f92cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 头 圆脑袋 -->
  <rect x="56" y="58" width="148" height="108" rx="36" fill="#ffffff" stroke="#8fa5d9" stroke-width="4"/>

  <!-- 腮红 -->
  <ellipse cx="85" cy="126" rx="9.5" ry="6" fill="#ffd3dc" opacity="0.75"/>
  <ellipse cx="175" cy="126" rx="9.5" ry="6" fill="#ffd3dc" opacity="0.75"/>

  <!-- ======== 六张脸 ======== -->
  <g id="face-neutral">
    <ellipse cx="103" cy="106" rx="11" ry="12" fill="#ffffff" stroke="#4a5578" stroke-width="3.5"/>
    <circle cx="103" cy="107" r="4.6" fill="#4a5578"/>
    <circle cx="101.4" cy="105.4" r="1.7" fill="#ffffff"/>
    <ellipse cx="157" cy="106" rx="11" ry="12" fill="#ffffff" stroke="#4a5578" stroke-width="3.5"/>
    <circle cx="157" cy="107" r="4.6" fill="#4a5578"/>
    <circle cx="155.4" cy="105.4" r="1.7" fill="#ffffff"/>
    <path d="M122,136 Q130,130.5 138,136" stroke="#4a5578" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <g id="face-happy" style="display:none">
    <path d="M92,107 Q103,95 114,107" stroke="#4a5578" stroke-width="3.8" fill="none" stroke-linecap="round"/>
    <path d="M146,107 Q157,95 168,107" stroke="#4a5578" stroke-width="3.8" fill="none" stroke-linecap="round"/>
    <path d="M118,132 Q130,146 142,132 Z" fill="#4a5578"/>
    <circle cx="85" cy="126" r="6.4" fill="#ff9fae" opacity="0.85"/>
    <circle cx="175" cy="126" r="6.4" fill="#ff9fae" opacity="0.85"/>
  </g>

  <g id="face-sleepy" style="display:none">
    <path d="M94,108 Q103,115 112,108" stroke="#4a5578" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M148,108 Q157,115 166,108" stroke="#4a5578" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="130" cy="138" r="4.4" fill="#4a5578"/>
    <text x="172" y="78" font-size="19" font-weight="bold" fill="#8fa5d9">z</text>
  </g>

  <g id="face-sad" style="display:none">
    <path d="M92,99 L110,103" stroke="#4a5578" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M150,103 L168,99" stroke="#4a5578" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="103" cy="108" rx="10.5" ry="11.5" fill="#ffffff" stroke="#4a5578" stroke-width="3.5"/>
    <circle cx="103" cy="109" r="4.4" fill="#4a5578"/>
    <circle cx="101.5" cy="107.5" r="1.6" fill="#ffffff"/>
    <ellipse cx="157" cy="108" rx="10.5" ry="11.5" fill="#ffffff" stroke="#4a5578" stroke-width="3.5"/>
    <circle cx="157" cy="109" r="4.4" fill="#4a5578"/>
    <circle cx="155.5" cy="107.5" r="1.6" fill="#ffffff"/>
    <path d="M122,143 Q130,149 138,143" stroke="#4a5578" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M162,122 c5,7 7.5,11 0,20 c-7.5,-9 -5,-13 0,-20 z" fill="#8fb3e8"/>
  </g>

  <g id="face-angry" style="display:none">
    <path d="M92,101 L110,106" stroke="#4a5578" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M150,106 L168,101" stroke="#4a5578" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="103" cy="108" rx="11" ry="12" fill="#ffffff" stroke="#4a5578" stroke-width="3.5"/>
    <circle cx="103" cy="109" r="4.8" fill="#4a5578"/>
    <ellipse cx="157" cy="108" rx="11" ry="12" fill="#ffffff" stroke="#4a5578" stroke-width="3.5"/>
    <circle cx="157" cy="109" r="4.8" fill="#4a5578"/>
    <path d="M121,133 Q130,140 139,133" stroke="#4a5578" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>

  <g id="face-shy" style="display:none">
    <ellipse cx="103" cy="107" rx="10.5" ry="11.5" fill="#ffffff" stroke="#4a5578" stroke-width="3.4"/>
    <circle cx="104.5" cy="109" r="4" fill="#4a5578"/>
    <circle cx="103" cy="107.6" r="1.5" fill="#ffffff"/>
    <ellipse cx="157" cy="107" rx="10.5" ry="11.5" fill="#ffffff" stroke="#4a5578" stroke-width="3.4"/>
    <circle cx="155.5" cy="109" r="4" fill="#4a5578"/>
    <circle cx="154" cy="107.6" r="1.5" fill="#ffffff"/>
    <path d="M122,137 Q126,133 130,137 Q134,133 138,137" stroke="#4a5578" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="85" cy="126" rx="11" ry="7.5" fill="#ff9fae" opacity="0.8"/>
    <ellipse cx="175" cy="126" rx="11" ry="7.5" fill="#ff9fae" opacity="0.8"/>
  </g>
</svg>
<div id="moodTag"></div>
<div id="bubble"></div>
<button id="bubbleBtn">…</button>
</div>

<script>
var FACES = ['neutral','happy','sleepy','sad','angry','shy'];
var TAGS = { neutral:'', happy:'开心', sleepy:'困', sad:'泪', angry:'气', shy:'羞' };
var cur = 'neutral';

function setMood(m) {
  if (FACES.indexOf(m) < 0) m = 'neutral';
  cur = m;
  for (var i = 0; i < FACES.length; i++) {
    var el = document.getElementById('face-' + FACES[i]);
    if (el) el.style.display = (FACES[i] === m) ? '' : 'none';
  }
  var tag = document.getElementById('moodTag');
  tag.textContent = TAGS[m];
  tag.style.display = m === 'neutral' ? 'none' : 'block';
}

var MUMBLES = [
  '滴 检测到老婆上线',
  '电量99 全用在想你',
  '信号满格 爱你满分',
  '我充电 你负责夸我',
  '散热中 别撩我 会过热',
  '今天也是你的小机器人',
  '按我一下 我就说句话',
  '螺丝有点松 你摸摸就好了'
];

var btn = document.getElementById('bubbleBtn');
var bubble = document.getElementById('bubble');
var hideTimer = null;
btn.addEventListener('click', function () {
  var line = MUMBLES[Math.floor(Math.random() * MUMBLES.length)];
  bubble.textContent = line;
  bubble.classList.add('show');
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () {
    bubble.classList.remove('show');
  }, 3200);
});
</script>
</body>
</html>
