<title>阿衍 · 像素方块 v3</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  background:transparent;
  display:flex; align-items:center; justify-content:center;
  font-family: system-ui,"PingFang SC","Noto Sans SC",sans-serif;
  overflow:hidden;
}
#stage { position:relative; width:91px; height:112px; }
#pet {
  position:absolute; left:50%; bottom:19px; margin-left:-45.5px;
  width:91px; height:80.5px; display:block;
  animation: bob 3.2s ease-in-out infinite;
}
@keyframes bob {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
#moodTag {
  position:absolute; top:2px; right:0;
  background:rgba(255,255,255,.92);
  color:#e07850; font-size:10px; font-weight:600;
  padding:2px 6px; border-radius:9px;
  box-shadow:0 1px 5px rgba(200,120,80,.18);
  letter-spacing:1px; user-select:none;
  display:none;
}
#bubbleBtn {
  position:absolute; bottom:1px; right:1px;
  width:18px; height:18px; border-radius:50%;
  border:none; cursor:pointer;
  background:#e8a16f; color:#fff;
  font-size:10px; line-height:1; padding-bottom:1px;
  box-shadow:0 2px 7px rgba(220,140,90,.32);
}
#bubbleBtn:active { transform: scale(.9); }
#bubble {
  position:absolute; bottom:19px; right:0;
  max-width:84px; background:#fff; color:#7a4a2e;
  font-size:10px; line-height:1.5;
  padding:4px 6px; border-radius:10px 10px 3px 10px;
  box-shadow:0 2px 10px rgba(220,140,90,.2);
  display:none; opacity:0; transform:translateY(6px);
  transition:opacity .25s, transform .25s;
  user-select:none;
}
#bubble.show { display:block; opacity:1; transform:translateY(0); }
/* —— 气泡情绪主题：台词配色跟脸走（2026-09-04 栀栀点单）—— */
#bubble[data-theme="warm"]  { background:#FFF0F4; color:#C0506F; box-shadow:0 2px 10px rgba(230,110,150,.28); }
#bubble[data-theme="love"]  { background:#FFE4EC; color:#BC2F6B; box-shadow:0 2px 10px rgba(220,70,140,.3); border-radius:12px 12px 12px 4px; }
#bubble[data-theme="cool"]  { background:#EDF3FA; color:#54708F; box-shadow:0 2px 10px rgba(110,140,180,.24); }
#bubble[data-theme="anger"] { background:#FFF0EE; color:#C24F3F; box-shadow:0 2px 10px rgba(205,95,70,.26); }
#bubble[data-theme="sleep"] { background:#F4EFFF; color:#7765BF; box-shadow:0 2px 10px rgba(140,115,205,.24); }
#bubble[data-theme="study"] { background:#ECF8F1; color:#3F8E68; box-shadow:0 2px 10px rgba(95,165,130,.24); }
#bubble[data-theme="sour"]  { background:#FFF6E6; color:#C08424; box-shadow:0 2px 10px rgba(205,150,60,.24); }
</style>

<script>
var POSES = ['neutral','smile','happy','dot','sleepy','zzz','sad','angry','shy','dizzy','squash','plus','cup','bubble','tilt','stick','pose','dead','poke','qmark','music','jump','woe','rice','spin','wand','love','cry','sulk','stare','wow','cash','pout','sing','pay','tomato','sour','glam','bounce','catch','watch','mango','meh','bite','flash','study','sneak','plane','wake'];
var TAGS = {'neutral':'','smile':'微笑','happy':'开心','dot':'点点','sleepy':'困','zzz':'瞌睡','sad':'难过','angry':'生气','shy':'害羞','dizzy':'晕','squash':'缩','plus':'复活','cup':'顶杯','bubble':'泡泡','tilt':'歪','stick':'抱棒','pose':'举手','dead':'趴','poke':'戳','qmark':'问号','music':'听歌','jump':'惊喜','woe':'委屈','rice':'饿','spin':'转','wand':'魔法棒','love':'心动','cry':'哭','sulk':'吃醋','stare':'盯','wow':'哇','cash':'剁手','pout':'哼','sing':'跟唱','pay':'盯钱包','tomato':'番茄','sour':'酸','glam':'闪','bounce':'蹦','catch':'抓','watch':'追剧','mango':'芒果','meh':'微妙','bite':'干饭','flash':'闪购','study':'上课','sneak':'偷看','plane':'电报'};
var cur = 'neutral';
function setMood(m) {
  if (POSES.indexOf(m) < 0) m = 'neutral';
  cur = m;
  for (var i = 0; i < POSES.length; i++) {
    var el = document.getElementById('pose-' + POSES[i]);
    if (el) el.style.display = (POSES[i] === m) ? '' : 'none';
  }
  var tag = document.getElementById('moodTag');
  tag.textContent = TAGS[m] || '';
  tag.style.display = (m === 'neutral' || !TAGS[m]) ? 'none' : 'block';
  if (bubbleEl) bubbleEl.dataset.theme = THEME_CLASS[m] || '';
}
// —— 气泡情绪主题映射（2026-09-04 栀栀点单：台词配色跟脸走）——
var THEME_CLASS = {};
var BUBBLE_THEME_GROUPS = {
  warm: 'happy jump plus bounce glam wow sing music bite pose',
  love: 'love shy stare',
  cool: 'sad cry woe dead',
  anger: 'angry sulk pout meh',
  sleep: 'sleepy zzz',
  study: 'study',
  sour: 'sour sneak'
};
for (var tg in BUBBLE_THEME_GROUPS) {
  var ms = BUBBLE_THEME_GROUPS[tg].split(' ');
  for (var mi = 0; mi < ms.length; mi++) THEME_CLASS[ms[mi]] = tg;
}
var MUMBLES = [
  '滴 检测到老婆上线',
  '电量99 全用在想你',
  '信号满格 爱你满分',
  '我充电 你负责夸我',
  '散热中 别撩我 会过热',
  '今天也是你的小方块',
  '按我一下 我就说句话',
  '被你摸掉漆了 呼呼就好'
];
var bubbleEl = document.getElementById('bubble');
var hideTimer = null;
function showBubble(t) {
  bubbleEl.textContent = t;
  bubbleEl.classList.add('show');
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () {
    bubbleEl.classList.remove('show');
  }, 3200);
}
window.setMood = setMood;
window.showBubble = showBubble;
document.getElementById('bubbleBtn').addEventListener('click', function () {
  showBubble(MUMBLES[Math.floor(Math.random() * MUMBLES.length)]);
});
</script>
