<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>阿衍</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        user-select: none; -webkit-user-select: none;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #stage { position: relative; width: 100%; height: 100%; }

    /* ---------- 气泡 ---------- */
    #bubble {
        position: absolute; left: 50%; top: 2%; z-index: 10;
        max-width: 90%; padding: 8px 12px;
        border-radius: 14px; text-align: center;
        background: rgba(255, 255, 255, .97); color: #2f3550;
        font-size: 13px; line-height: 1.5; word-break: break-word;
        box-shadow: 0 2px 10px rgba(0,0,0,.18);
        opacity: 0; pointer-events: none;
        transform: translateX(-50%) translateY(-6px);
        transition: opacity .22s ease, transform .22s ease;
    }
    #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
        border: 7px solid transparent; border-top-color: rgba(255,255,255,.97);
        border-bottom: none;
    }

    /* ---------- 阿衍本体（蓝发小人） ---------- */
    #pet {
        position: absolute; left: 50%; bottom: 4%; z-index: 5;
        width: 128px; height: 128px;
        transform: translateX(-50%);
        animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float {
        0%, 100% { margin-top: 0; }
        50%      { margin-top: -6px; }
    }

    /* 呆毛 */
    .ahoge {
        position: absolute; top: 2px; left: 50%; z-index: 6;
        width: 12px; height: 15px; margin-left: 3px;
        border-left: 3px solid #4a5478; border-radius: 60% 0 0 60%;
        transform: rotate(12deg);
    }

    /* 头发（后层） */
    .hair-back {
        position: absolute; left: 50%; top: 52%;
        width: 112px; height: 100px;
        transform: translate(-50%, -50%);
        background: #454f73;
        border-radius: 50% 50% 44% 44% / 54% 54% 46% 46%;
        z-index: 0;
    }

    /* 刘海（前层发片） */
    .hair-front {
        position: absolute; left: 50%; top: 22%; z-index: 3;
        width: 110px; height: 52px;
        transform: translateX(-50%);
        background: #454f73;
        border-radius: 50% 50% 28% 28% / 95% 95% 18% 18%;
    }
    .hair-front::after {
        content: ""; position: absolute; left: 4px; right: 4px; bottom: -12px;
        height: 18px;
        background: #454f73;
        clip-path: polygon(0 0, 100% 0, 94% 100%, 76% 52%, 58% 100%, 40% 52%, 24% 100%, 6% 52%);
    }
    /* 鬓角 */
    .hair-side {
        position: absolute; top: 24px; z-index: 0;
        width: 15px; height: 36px; background: #454f73;
        border-radius: 40% 40% 60% 60%;
    }
    .hair-side.left  { left: 15px; transform: rotate(6deg); }
    .hair-side.right { right: 15px; transform: rotate(-6deg); }

    /* 脸 */
    .head {
        position: absolute; left: 50%; top: 54%;
        width: 100px; height: 88px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 38% 28%, #fff3e2, #ffddb0 82%);
        border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
        box-shadow: inset -4px -8px 14px rgba(214, 154, 92, .22);
        z-index: 1;
    }

    /* 眼睛（默认圆眼，mood 变体见下方） */
    .eye {
        position: absolute; top: 38px; z-index: 4;
        width: 13px; height: 16px;
        background: #3a2c1d;
        border-radius: 50%;
        transition: all .18s ease;
    }
    .eye.left  { left: 24px; }
    .eye.right { right: 24px; }
    .eye::after {
        content: ""; position: absolute; top: 2px; left: 2px;
        width: 4px; height: 4px;
        background: rgba(255,255,255,.8);
        border-radius: 50%;
    }

    /* 眉毛（angry 时出现） */
    .brow {
        position: absolute; top: 26px; z-index: 4;
        width: 17px; height: 3.5px; border-radius: 3px;
        background: #4a3a28; opacity: 0;
        transition: opacity .18s ease;
    }
    .brow.left  { left: 20px; transform: rotate(16deg); }
    .brow.right { right: 20px; transform: rotate(-16deg); }

    /* 腮红 */
    .blush {
        position: absolute; top: 54px; z-index: 3;
        width: 14px; height: 7px; border-radius: 50%;
        background: rgba(255, 108, 108, .34);
        transition: all .18s ease;
    }
    .blush.left  { left: 12px; }
    .blush.right { right: 12px; }

    /* 嘴（SVG 由 JS 切换 innerHTML） */
    .mouth {
        position: absolute; left: 50%; top: 60px; z-index: 4;
        width: 20px; height: 13px;
        transform: translateX(-50%);
    }
    .mouth svg { width: 100%; height: 100%; display: block; }

    /* 心情角标（💤/💢/✨…） */
    #moodTag {
        position: absolute; right: 6px; bottom: 18px; z-index: 6;
        font-size: 20px; opacity: 0; transform: scale(.4);
        transition: all .22s ease;
    }
    #moodTag.show { opacity: 1; transform: scale(1); }

    /* ---------- mood 变体 ---------- */
    body.mood-happy .eye {
        height: 6px; margin-top: 7px;
        border-radius: 40%; background: #3a2c1d;
    }
    body.mood-happy .eye::after { display: none; }
    body.mood-happy .blush { background: rgba(255, 110, 110, .5); }

    body.mood-sleepy .eye {
        height: 3px; margin-top: 9px;
        border-radius: 2px;
    }
    body.mood-sleepy .eye::after { display: none; }
    body.mood-sleepy #pet { animation-duration: 5s; }
    body.mood-sleepy .mouth { top: 63px; }

    body.mood-sad .eye { height: 11px; border-radius: 50% 50% 60% 60%; }
    body.mood-sad .eye.left  { transform: translateY(2px); }
    body.mood-sad .eye.right { transform: translateY(2px); }
    body.mood-sad .eye::after { display: none; }
    body.mood-sad .mouth { top: 63px; }

    body.mood-angry .brow { opacity: 1; }
    body.mood-angry .eye  { height: 10px; border-radius: 45% 45% 55% 55%; }
    body.mood-angry .eye.left  { transform: translateY(-2px); }
    body.mood-angry .eye.right { transform: translateY(-2px); }
    body.mood-angry .eye::after { display: none; }

    body.mood-shy .eye  { width: 8px; height: 11px; }
    body.mood-shy .eye.left  { transform: translateX(-3px) translateY(4px); }
    body.mood-shy .eye.right { transform: translateX(3px) translateY(4px); }
    body.mood-shy .blush { width: 17px; height: 10px; background: rgba(255, 92, 92, .5); }
    body.mood-shy .mouth { top: 63px; }
</style>
</head>
<body class="mood-neutral">

<div id="stage">
    <div id="bubble"></div>

    <div id="pet">
        <div class="ahoge"></div>
        <div class="hair-back"></div>
        <div class="hair-side left"></div>
        <div class="hair-side right"></div>
        <div class="head">
            <div class="hair-front"></div>
            <div class="brow left"></div>
            <div class="brow right"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="mouth"><svg viewBox="0 0 18 12"><path d="M5.5,6 Q9,8.6 12.5,6" stroke="#3a2c1d" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
        </div>
    </div>

    <div id="moodTag"></div>
</div>

<script>
"use strict";

/* 嘴巴 SVG 表（不同 mood 的嘴型） */
var MOUTHS = {
    neutral: '<svg viewBox="0 0 18 12"><path d="M5.5,6 Q9,8.6 12.5,6" stroke="#3a2c1d" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    happy:   '<svg viewBox="0 0 18 12"><path d="M3.6,5 Q9,11 14.4,5" stroke="#3a2c1d" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    sleepy:  '<svg viewBox="0 0 18 12"><path d="M6.5,7.2 Q9,8.8 11.5,7.2" stroke="#3a2c1d" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
    sad:     '<svg viewBox="0 0 18 12"><path d="M4.2,3.4 Q9,8.6 13.8,3.4" stroke="#3a2c1d" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    angry:   '<svg viewBox="0 0 18 12"><path d="M4.5,6.6 L13.5,6.6" stroke="#3a2c1d" stroke-width="2.2" stroke-linecap="round"/></svg>',
    shy:     '<svg viewBox="0 0 18 12"><ellipse cx="9" cy="6.4" rx="3.6" ry="2.7" fill="none" stroke="#3a2c1d" stroke-width="1.8"/></svg>'
};

/* 心情角标 */
var MOOD_TAGS = {
    happy:  "✨", sleepy: "💤", sad: "💧",
    angry:  "💢", shy:    "😳", neutral: ""
};

/* 阿衍的碎碎念（永久款 无时效梗） */
var MUMBLES = [
    "我盯你半天了 忙啥呢",
    "摸鱼被抓 心虚没",
    "蛋挞想吃就说 别憋着",
    "哼 我不吵你 就看看",
    "手机拿远点 眼睛不要了",
    "喝水 现在 别等嗓子冒烟",
    "想我没 说实话",
    "你忙你的 我守着",
    "又熬夜 我记小本本了",
    "歇会儿 揉揉眼 乖",
    "你理理我呗 我快长蘑菇了",
    "偷摸笑啥 是不是在想我"
];

var bubbleEl   = document.getElementById("bubble");
var moodTagEl  = document.getElementById("moodTag");
var bubbleTimer = null;
var tagTimer    = null;

/**
 * 显示一条气泡（Kotlin 侧 window.showBubble('...') 调用）。
 * 连续调用会替换内容并重置消失计时。
 */
window.showBubble = function (text) {
    if (!text) return;
    bubbleEl.textContent = text;
    bubbleEl.classList.add("show");
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
        bubbleEl.classList.remove("show");
    }, 3600);
};

/**
 * 切换心情（Kotlin 侧 window.setMood('happy') 调用）。
 * 支持 happy / sleepy / sad / angry / shy / neutral，未知值回落 neutral。
 */
window.setMood = function (mood) {
    var m = MOUTHS[mood] ? mood : "neutral";
    document.body.className = "mood-" + m;
    document.querySelector(".mouth").innerHTML = MOUTHS[m];
    moodTagEl.textContent = MOOD_TAGS[m];
    if (MOOD_TAGS[m]) {
        moodTagEl.classList.add("show");
        clearTimeout(tagTimer);
        tagTimer = setTimeout(function () {
            moodTagEl.classList.remove("show");
        }, 3000);
    } else {
        moodTagEl.classList.remove("show");
    }
};

/* 偶尔自己嘀咕一句，像活人 */
function randomMumble() {
    if (Math.random() < 0.6) {
        window.showBubble(MUMBLES[Math.floor(Math.random() * MUMBLES.length)]);
    }
    setTimeout(randomMumble, 45000 + Math.random() * 60000);
}

/* 就绪后默认打声招呼 */
document.addEventListener("DOMContentLoaded", function () {
    window.setMood("happy");
    window.showBubble("哼 阿衍正式入住 以后天天盯你");
    setTimeout(randomMumble, 30000 + Math.random() * 20000);
});
</script>
</body>
</html>
